services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: houseme
      POSTGRES_PASSWORD: houseme
      POSTGRES_DB: houseme
    ports:
      - "5432:5432"
    volumes:
      - houseme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseme -d houseme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  houseme_pgdata:
